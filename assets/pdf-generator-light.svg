<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="pdf-generator: splits a long page into chunks, renders them with Playwright, and merges them with PDFBox into one PDF.">
<style>.b0{animation:b 5s 0.0s infinite}.b1{animation:b 5s 0.7s infinite}.b2{animation:b 5s 1.4s infinite}.b3{animation:b 5s 2.1s infinite}.b4{animation:b 5s 2.8s infinite}@keyframes b{0%,18%,100%{stroke:#d0d7de}6%,12%{stroke:#1a7f37}}@media (prefers-reduced-motion:reduce){.b{animation:none!important}}</style>
<rect x="1" y="1" width="998" height="248" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="40" y="58" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="31" font-weight="700" fill="#0969da">pdf-generator</text>
<text x="960" y="56" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#59636e">Open the repo &#8594;</text>
<text x="40" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#1f2328">Turns a page too long for one browser print into a single PDF.</text>
<text x="40" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#59636e">Spring Boot, Java 17, async jobs with status polling</text>
<rect class="b b0" x="40" y="152" width="160" height="66" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="120.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#1f2328">Long page</text><path d="M205 185h18m-7-7l7 7-7 7" fill="none" stroke="#59636e" stroke-width="2.5"/><rect class="b b1" x="230" y="152" width="160" height="66" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="310.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#1f2328">Chunks</text><path d="M395 185h18m-7-7l7 7-7 7" fill="none" stroke="#59636e" stroke-width="2.5"/><rect class="b b2" x="420" y="152" width="160" height="66" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="500.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#1f2328">Playwright</text><path d="M585 185h18m-7-7l7 7-7 7" fill="none" stroke="#59636e" stroke-width="2.5"/><rect class="b b3" x="610" y="152" width="160" height="66" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="690.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#1f2328">PDFBox</text><path d="M775 185h18m-7-7l7 7-7 7" fill="none" stroke="#59636e" stroke-width="2.5"/><rect class="b b4" x="800" y="152" width="160" height="66" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="880.0" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#1f2328">One PDF</text>
</svg>