<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="An endpoint taken from 30 seconds to 2 seconds, drawn to scale. Before, five API calls ran one after another. After, the independent calls ran at the same time and rarely changing responses came from a cache.">
<style>.s{transform-box:fill-box;transform-origin:left}.s0{animation:r0 9s linear infinite}@keyframes r0{0%,0%{transform:scaleX(0)}15%,100%{transform:scaleX(1)}}.s1{animation:r1 9s linear infinite}@keyframes r1{0%,15%{transform:scaleX(0)}30%,100%{transform:scaleX(1)}}.s2{animation:r2 9s linear infinite}@keyframes r2{0%,30%{transform:scaleX(0)}45%,100%{transform:scaleX(1)}}.s3{animation:r3 9s linear infinite}@keyframes r3{0%,45%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}.s4{animation:r4 9s linear infinite}@keyframes r4{0%,60%{transform:scaleX(0)}75%,100%{transform:scaleX(1)}}
.f{transform-box:fill-box;transform-origin:left;animation:f 9s linear infinite}@keyframes f{0%{transform:scaleX(0)}5%,100%{transform:scaleX(1)}}
.fd{animation:fd 9s linear infinite}@keyframes fd{0%,5%{opacity:0}7%,100%{opacity:1}}
.sd{animation:sd 9s linear infinite}@keyframes sd{0%,75%{opacity:0}77%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.s,.f,.fd,.sd{animation:none!important}}</style>
<rect x="1" y="1" width="998" height="298" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="40" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">One endpoint, 30 seconds to 2</text>
<text x="40" y="84" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#f0883e">before: five APIs, one after another</text>
<text class="sd" x="960" y="84" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#f0883e">30 s</text>
<rect x="42" y="96" width="180" height="52" rx="6" fill="#3a2a1d"/><rect class="s s0" x="42" y="96" width="180" height="52" rx="6" fill="#f0883e"/><rect x="226" y="96" width="180" height="52" rx="6" fill="#3a2a1d"/><rect class="s s1" x="226" y="96" width="180" height="52" rx="6" fill="#f0883e"/><rect x="410" y="96" width="180" height="52" rx="6" fill="#3a2a1d"/><rect class="s s2" x="410" y="96" width="180" height="52" rx="6" fill="#f0883e"/><rect x="594" y="96" width="180" height="52" rx="6" fill="#3a2a1d"/><rect class="s s3" x="594" y="96" width="180" height="52" rx="6" fill="#f0883e"/><rect x="778" y="96" width="180" height="52" rx="6" fill="#3a2a1d"/><rect class="s s4" x="778" y="96" width="180" height="52" rx="6" fill="#f0883e"/><text x="132" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#f0f6fc">API 1</text><text x="316" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#f0f6fc">API 2</text><text x="500" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#f0f6fc">API 3</text><text x="684" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#f0f6fc">API 4</text><text x="868" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="21" font-weight="600" fill="#f0f6fc">API 5</text>
<text x="40" y="192" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#3fb950">after: independent calls together, stable responses cached</text>
<rect x="42" y="204" width="916" height="52" rx="6" fill="#1b3324" opacity=".45"/>
<rect class="f" x="42" y="204" width="61" height="52" rx="6" fill="#3fb950"/>
<text class="fd" x="117" y="239" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#3fb950">2 s, done</text>
<text x="960" y="284" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9da7b3">Both bars drawn to the same scale</text>
</svg>